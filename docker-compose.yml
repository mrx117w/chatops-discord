services:
  chatops-bot:
    build: .
    container_name: chatops_bot
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env

  prometheus:
    image: prom/prometheus
    container_name: chatops_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: chatops_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Configura GRAFANA_ADMIN_PASSWORD en .env}
